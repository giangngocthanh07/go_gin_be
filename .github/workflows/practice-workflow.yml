name: Practice Workflow

on:
  push:
    branches: [main]

env:
  ABC: "NGOCTHANH"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check Dockerfile
        id: check
        run: |
            ls -la
            test -f Dockerfile
            echo "status=success" >> $GITHUB_OUTPUT

      - name: Show
        # Gọi lại step trước bằng id
        run: echo ${{ steps.check.outputs.status }}
