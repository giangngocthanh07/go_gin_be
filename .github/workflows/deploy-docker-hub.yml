name: Deploy Docker Hub
on:
  push:
    branches: [main]
env:
  SSH_SERVER: ${{ secrets.SSH_USER }}@${{ secrets.IP_SERVER_RUN }}
  WORK_DIR: /home/ubuntu/devops04/go_gin_be
  COMPOSE_FILE_DIR: /home/ubuntu/devops04
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: webfactory/ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust Host
        run: ssh-keyscan -H ${{ secrets.IP_SERVER_RUN }} >> ~/.ssh/known_hosts

      - name: Check Dockerfile
        run: test -f Dockerfile

      - name: Check env file
        run: |
          ssh $SSH_SERVER "
            set -e
            cd $WORK_DIR
            test -f .env
          "

      - name: Check Docker Compose file
        run: |
          ssh $SSH_SERVER "
            set -e
            cd $COMPOSE_FILE_DIR
            test -f docker-compose.yml
          "
